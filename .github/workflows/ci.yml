name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run unit and integration tests
        run: python -m pytest -q

      - name: Compile Python modules
        run: python -m compileall -q unipay_router vercel_app.py

      - name: Validate OpenAPI and deployment JSON
        run: |
          python -m json.tool openapi/openapi.json >/dev/null
          python -m json.tool vercel.json >/dev/null
          python -m json.tool postman/UniPay-Router.postman_collection.json >/dev/null

      - name: Check repository whitespace
        run: git diff --check
