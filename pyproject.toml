[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unipay-router"
version = "0.1.0"
description = "Universal Payment Routing Network — sender pays how they want, receiver receives how they want"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "UniPay Team"},
]
keywords = ["payment", "routing", "upi", "fintech", "hyperswitch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
unipay = "unipay_router.cli:main"
unipay-server = "unipay_router.server:run"

[tool.hatch.build.targets.wheel]
packages = ["unipay_router"]

[tool.vercel]
entrypoint = "vercel_app:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
