events {}

http {
  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$http_x_request_id","request":"$request","status":$status,"request_time":$request_time}';
  access_log /var/log/nginx/access.log json;

  upstream unipay_router {
    server unipay-router:3000;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;

    location / {
      proxy_pass http://unipay_router;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Trace-ID $http_x_trace_id;
      proxy_read_timeout 30s;
    }

    location = /metrics {
      allow 127.0.0.1;
      deny all;
      proxy_pass http://unipay_router;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
