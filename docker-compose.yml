services:
  unipay-router:
    build: .
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      # Set this in a .env file for shared environments; blank means local demo mode.
      UNIPAY_API_KEY: ${UNIPAY_API_KEY:-}
    restart: unless-stopped
